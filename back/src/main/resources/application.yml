spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/banco?stringtype=unspecified}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    auto-commit: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    baseline-version: 1

  jpa:
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
        jdbc:
          lob:
           non_contextual_creation: true
    hibernate:
      ddl-auto: validate

  security:
    oauth2:
      client:
        registration:
          keycloak:
            client-id: app_lmts
            authorization-grant-type: authorization_code
            scope: openid
        provider:
          keycloak:
            issuer-uri: http://localhost:8080/realms/lmts
            user-name-attribute: preferred_username
      resourceserver:
        jwt:
          jwk-set-uri: http://localhost:8080/realms/lmts/protocol/openid-connect/certs

springdoc:
  api-docs:
    path: /api-doc/docs
  swagger-ui:
    path: /api-doc/swagger.html

server:
  port: 8081
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

common:
  seeders: false
  front: http://localhost:3000/,https://lmtsteste06.ufape.edu.br/
  back: http://localhost:8081/,https://lmtsteste03.ufape.edu.br/
  docker: ${KEYCLOAK_SERVER_URL:http://keycloak:8080/}

keycloak:
  realm: ${KEYCLOAK_REALM:lmts}
  client-id: ${KEYCLOAK_CLIENT_ID:create_user}
  client-secret: ${KEYCLOAK_CLIENT_SECRET:}
  admin:
    username: ${KEYCLOAK_ADMIN_USERNAME:admin}
    password: ${KEYCLOAK_ADMIN_PASSWORD:admin}

app:
  files:
    upload-fotos:
      path: ./uploads/fotos/
      max-size: 5MB
      allowed-types: image/png,image/jpeg,image/jpg,image/webp

---
spring:
  config:
    activate:
      on-profile: docker
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://backend-db:5432/hvu?stringtype=unspecified}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://keycloak:8080/realms/lmts/protocol/openid-connect/certs
  app:
    files:
      upload-fotos:
        path: /app/uploads/fotos/
        max-size: 5MB
        allowed-types: image/png,image/jpeg,image/jpg,image/webp

server:
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

logging:
  level:
    root: ERROR
    br.edu.ufape.hvu: ERROR
    org.springframework.web: ERROR
