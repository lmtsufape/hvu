version: "3.9"
services:
  backend:
    image: hvu-backend
    build: back/.
    ports:
      - "8081:8081"
    expose:
      - "8081"
    command: mvn spring-boot:run
    networks:
      - hvu-networks
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: ${HVU_DB_URL:-jdbc:postgresql://backend-db:5432/hvu?stringtype=unspecified}
      SPRING_DATASOURCE_USERNAME: ${HVU_DB_USERNAME:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${HVU_DB_PASSWORD:?Defina HVU_DB_PASSWORD no arquivo .env}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-lmts}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-create_user}
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:?Defina KEYCLOAK_CLIENT_SECRET no arquivo .env}
      KEYCLOAK_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Defina KEYCLOAK_ADMIN_PASSWORD no arquivo .env}
    depends_on:
      - backend-db
      - keycloak
    volumes:
      - hvu-uploads:/app/uploads

  backend-db:
    image: postgres:16.0
    restart: always
    environment:
      POSTGRES_DB: ${HVU_DB_NAME:-hvu}
      POSTGRES_USER: ${HVU_DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${HVU_DB_PASSWORD:?Defina HVU_DB_PASSWORD no arquivo .env}
      TZ: America/Sao_Paulo
    ports:
      - "5433:5432"
    expose:
      - "5432"
    networks:
      - hvu-networks
    volumes:
      - pg-data:/var/lib/postgresql/data

  keycloak:
    image: quay.io/keycloak/keycloak
    ports:
      - "8080:8080"
    networks:
      - hvu-networks
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN_USERNAME:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Defina KEYCLOAK_ADMIN_PASSWORD no arquivo .env}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/${KEYCLOAK_DB_NAME:-keycloak}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USERNAME:-postgres}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?Defina KEYCLOAK_DB_PASSWORD no arquivo .env}
    volumes:
      - ./realm-export-dev.json:/opt/keycloak/data/import/realm-export-dev.json:ro
    command: start-dev --import-realm --db postgres
    depends_on:
      - keycloak-db

  keycloak-db:
    image: postgres:16.0
    restart: always
    environment:
      POSTGRES_DB: ${KEYCLOAK_DB_NAME:-keycloak}
      POSTGRES_USER: ${KEYCLOAK_DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?Defina KEYCLOAK_DB_PASSWORD no arquivo .env}
      TZ: America/Sao_Paulo
    ports:
      - "5434:5432"
    expose:
      - "5432"
    networks:
      - hvu-networks
    volumes:
      - keycloak-pg-data:/var/lib/postgresql/data

  frontend:
    image: react-image
    build:
      context: front/.
      args:
        NEXT_PUBLIC_KEYCLOAK_CLIENT_ID: ${NEXT_PUBLIC_KEYCLOAK_CLIENT_ID:-create_user}
        NEXT_PUBLIC_KEYCLOAK_CLIENT_SECRET: ${NEXT_PUBLIC_KEYCLOAK_CLIENT_SECRET:?Defina NEXT_PUBLIC_KEYCLOAK_CLIENT_SECRET no arquivo .env}
    volumes:
      - ./front/src:/app/src
    ports:
      - 3000:3000
    networks:
      - hvu-networks
    depends_on:
      - backend

volumes:
  pg-data:
    driver: local
  keycloak-pg-data:
    driver: local
  hvu-uploads:
    driver: local

networks:
  hvu-networks:
    driver: bridge
